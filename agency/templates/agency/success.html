{% extends 'agency/base.html' %}

{% block content %}
<style>
    .reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .reveal.is-visible { opacity: 1; transform: translateY(0); }

    .float-badge { animation: softFloat 4.5s ease-in-out infinite; }
    @keyframes softFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

    /* AI / ML illustration: a pulsing neural network */
    #ai-illustration { display:block; margin: 0 auto 1.5rem; }
    .node { animation: nodePulse 2.6s ease-in-out infinite; }
    @keyframes nodePulse { 0%,100% { opacity: 0.55; r: var(--rr, 4); } 50% { opacity: 1; r: calc(var(--rr, 4) + 1.3); } }
    .synapse {
        stroke-dasharray: 6 7;
        animation: synapseFlow 3.4s linear infinite;
        opacity: 0.55;
    }
    @keyframes synapseFlow { to { stroke-dashoffset: -130; } }
    .core-ring { animation: ringSpin 12s linear infinite; transform-origin: 100px 90px; }
    @keyframes ringSpin { to { transform: rotate(360deg); } }

    @media (hover: none) {
        a.inline-block:hover { transform: none; box-shadow: none; }
    }

    @media (prefers-reduced-motion: reduce) {
        .reveal { opacity: 1 !important; transform: none !important; }
        .float-badge, .node, .synapse, .core-ring { animation: none !important; }
    }
</style>

<div class="max-w-2xl mx-auto text-center py-12 sm:py-16 md:py-20 px-4 reveal">

    <!-- Animated AI / ML illustration -->
    <svg id="ai-illustration" width="180" height="150" viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" class="w-[140px] h-auto sm:w-[160px] md:w-[180px]">
        <defs>
            <linearGradient id="giltNet" x1="10" y1="10" x2="190" y2="160" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#d9a361"/>
                <stop offset="1" stop-color="#96683f"/>
            </linearGradient>
        </defs>

        <!-- orbiting ring around the core node, evoking a model/orbit -->
        <g class="core-ring">
            <ellipse cx="100" cy="90" rx="46" ry="16" fill="none" stroke="var(--beige)" stroke-width="1.4"/>
        </g>

        <!-- synapse connections -->
        <g fill="none" stroke="url(#giltNet)" stroke-width="1.6">
            <path class="synapse" d="M40 40 L100 90" style="animation-delay:0s"/>
            <path class="synapse" d="M160 40 L100 90" style="animation-delay:.4s"/>
            <path class="synapse" d="M30 120 L100 90" style="animation-delay:.8s"/>
            <path class="synapse" d="M170 120 L100 90" style="animation-delay:1.2s"/>
            <path class="synapse" d="M100 30 L100 90" style="animation-delay:1.6s"/>
            <path class="synapse" d="M40 40 L30 120" style="animation-delay:.2s"/>
            <path class="synapse" d="M160 40 L170 120" style="animation-delay:.6s"/>
        </g>

        <!-- nodes -->
        <circle class="node" cx="100" cy="30" style="--rr:4" r="4" fill="var(--caramel)"/>
        <circle class="node" cx="40" cy="40" style="--rr:4.5" r="4.5" fill="var(--copper)"/>
        <circle class="node" cx="160" cy="40" style="--rr:4.5" r="4.5" fill="var(--copper)"/>
        <circle class="node" cx="30" cy="120" style="--rr:4" r="4" fill="var(--caramel)"/>
        <circle class="node" cx="170" cy="120" style="--rr:4" r="4" fill="var(--caramel)"/>
        <circle class="node" cx="100" cy="90" style="--rr:8" r="8" fill="url(#giltNet)"/>
    </svg>

    <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full flex items-center justify-center text-3xl sm:text-4xl mx-auto mb-6 sm:mb-8 float-badge"
         style="background:var(--beige);">
        ✨
    </div>

    <h1 class="font-serif text-3xl sm:text-4xl md:text-5xl font-normal tracking-tight mb-4 sm:mb-6 break-words" style="color:var(--espresso);"
        data-i18n data-en="Message sent successfully!" data-sv="Meddelandet har skickats!">
        Message sent successfully!
    </h1>

    <p class="text-base sm:text-lg mb-8 sm:mb-10 leading-relaxed" style="color:var(--coffee); opacity:0.85;"
       data-i18n data-en="Thank you for reaching out. We have received your project details and our team will get back to you within one business day."
       data-sv="Tack för att du hörde av dig. Vi har tagit emot dina projektuppgifter och vårt team återkommer inom en arbetsdag.">
        Thank you for reaching out. We have received your project details and our team will get back to you within one business day.
    </p>

    <a href="{% url 'home' %}"
       class="inline-block w-full sm:w-auto px-8 py-3.5 rounded-lg text-sm font-medium transition shadow-sm hover:shadow-md hover:scale-[1.03] active:scale-[0.98]"
       style="background:var(--espresso); color:var(--cream);"
       data-i18n data-en="Return to Home" data-sv="Tillbaka till startsidan">
        Return to Home
    </a>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelector('.reveal').classList.add('is-visible');
        if (window.setLanguage && document.documentElement.lang === 'sv') {
            window.setLanguage('sv');
        }
    });
</script>
{% endblock %}
